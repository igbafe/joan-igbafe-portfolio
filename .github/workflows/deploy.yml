name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the static portfolio
        uses: actions/upload-pages-artifact@v4
        with:
          path: |
            index.html
            styles.css
            script.js
            favicon.svg
            assets
      - name: Deploy the portfolio
        id: deployment
        uses: actions/deploy-pages@v4
